name: Fail-closed build and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust build (not a security certification)
        run: cargo check --offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python tests (reject corrupt sources)
        run: python -m compileall -q tests
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Execute actual test modules (no synthetic score)
        run: python -m pytest -q tests/reality_battery.py tests/reality_check_harness.py
